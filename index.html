<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Jigsaw</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #20242a;
    color: white;
}

/* =========================================================
   TOOLBAR
   ========================================================= */

#toolbar {
    height: 60px;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 8px 12px;

    background: #30353d;
    border-bottom: 1px solid #555;

    position: relative;
    z-index: 100;
}

#toolbar label {
    font-size: 14px;
}

#toolbar label[for="guideOpacity"] {
    display: flex;
    align-items: center;
    gap: 6px;
}

#photo {
    max-width: 230px;
}

button,
select {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;

    padding: 7px 12px;

    border-radius: 5px;
    border: 1px solid #777;

    background: #444b55;
    color: white;
}

button {
    cursor: pointer;
}

button:hover {
    background: #59616c;
}

#status {
    margin-left: auto;
    white-space: nowrap;
}


/* =========================================================
   GAME AREA
   ========================================================= */

#game {
    position: absolute;

    left: 0;
    right: 0;
    top: 60px;
    bottom: 0;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #3b4149 0%,
            #292e35 55%,
            #1c2025 100%
        );

    touch-action: none;
}

#canvas {
    display: block;

    width: 100%;
    height: 100%;

    touch-action: none;
}


/* =========================================================
   PREVIEW
   ========================================================= */

#preview {
    position: absolute;

    right: 15px;
    bottom: 15px;

    width: 180px;
    max-height: 140px;

    object-fit: contain;

    background: #111;

    border: 2px solid white;

    box-shadow:
        0 4px 20px rgba(0,0,0,.7);

    display: none;

    z-index: 200;
}


/* =========================================================
   COMPLETION MESSAGE
   ========================================================= */

#complete {
    position: absolute;

    left: 0;
    right: 0;
    top: 0;
    bottom: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.6);

    z-index: 300;
}

#completeBox {
    background: #30353d;

    padding: 30px 45px;

    border-radius: 12px;

    text-align: center;

    box-shadow:
        0 10px 50px rgba(0,0,0,.8);
}

#completeBox h1 {
    margin-top: 0;
}

#completeBox button {
    margin-top: 15px;
}


/* =========================================================
   RESPONSIVE LAYOUT — HAMBURGER MENU ON ALL SCREEN SIZES
   ========================================================= */

:root {
    --header-height: 52px;
}

#toolbar {
    height: var(--header-height);
    min-height: var(--header-height);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: #30353d;
    border-bottom: 1px solid #555;
    position: relative;
    z-index: 1000;
    overflow: visible;
}

#mobileMenuButton {
    display: block;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    padding: 0;
    font-size: 25px;
    line-height: 1;
}

#mobileTitle {
    display: block;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
}

#toolbarControls {
    display: none;
    position: absolute;
    z-index: 1001;
    top: var(--header-height);
    left: 0;
    width: min(520px, 100vw);
    max-height: calc(100vh - var(--header-height));
    max-height: calc(100dvh - var(--header-height));
    overflow-y: auto;
    flex-wrap: wrap;
    align-content: flex-start;
    align-items: center;
    gap: 10px;
    padding: 14px;
    background: #30353d;
    border: 1px solid #555;
    border-top: 0;
    box-shadow: 0 10px 25px rgba(0,0,0,.45);
}

#toolbar.menu-open #toolbarControls {
    display: flex;
}

#toolbarControls > label,
#toolbarControls > input,
#toolbarControls > select,
#toolbarControls > button {
    flex: 0 0 auto;
}

#toolbarControls > #status {
    width: 100%;
    margin-left: 0;
    white-space: normal;
}

#toolbarControls #photo {
    max-width: min(280px, calc(100vw - 110px));
}

#toolbarControls label[for="guideOpacity"] {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 0 !important;
    width: 100%;
    flex-wrap: wrap;
}

#toolbarControls #guideOpacity {
    width: 110px;
}

#samplePuzzles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding-top: 8px;
    margin-top: 2px;
    border-top: 1px solid #555;
}

.sampleHeading {
    width: 100%;
    font-size: 13px;
    opacity: .8;
}

.sampleButton {
    min-height: 38px;
}

#game {
    top: var(--header-height);
}

@media (max-width: 420px) {
    #toolbarControls {
        gap: 9px;
        padding: 12px;
    }

    #toolbarControls #photo {
        max-width: calc(100vw - 100px);
    }

    #preview {
        right: 8px;
        bottom: 8px;
        width: min(45vw, 180px);
        max-height: 30vh;
    }

    #completeBox {
        max-width: calc(100vw - 30px);
        padding: 22px 24px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     TOOLBAR
     ======================================================= -->

<div id="toolbar">

    <button id="mobileMenuButton" aria-label="Open menu" aria-expanded="false">☰</button>
    <span id="mobileTitle">Photo Jigsaw</span>

    <div id="toolbarControls">


    <label>
        Photo:
    </label>

    <input
        type="file"
        id="photo"
        accept="image/*"
    >


    <label>
        Pieces:
    </label>

    <select id="pieceCount">

        <option value="6">
            6
        </option>
        <option value="16">
            16
        </option>
        <option value="25" selected >
            25
        </option>

        <option value="50">
            50
        </option>

        <option value="100">
            100
        </option>

        <option value="200">
            200
        </option>

    </select>


    <button id="newPuzzle">
        New Puzzle
    </button>

    <button id="previewButton">
        Preview
    </button>

    <label style="margin-left: 15px;">
        <input type="checkbox" id="snapHighlight" checked>
        Snap highlight
    </label>

    <label style="margin-left: 15px;">
        <input type="checkbox" id="snapSound" checked>
        Snap sound
    </label>

    <label style="margin-left: 15px;" for="guideOpacity">
        Visible Picture Guide:
        <input
            type="range"
            id="guideOpacity"
            min="0"
            max="100"
            value="5"
            step="5"
        >
        <span id="guideOpacityValue">5%</span>
    </label>

    <span id="status">
        Please choose a photograph
    </span>



        <div id="samplePuzzles">
            <span class="sampleHeading">Sample puzzles:</span>
            <button type="button" class="sampleButton" id="sampleMountain">🏔️ Mountain Lake</button>
            <button type="button" class="sampleButton" id="sampleLighthouse">🗼 Lighthouse</button>
        </div>

    </div>

</div>


<!-- =======================================================
     GAME
     ======================================================= -->

<div id="game">

    <canvas id="canvas"></canvas>

    <img
        id="preview"
        alt="Puzzle preview"
    >


    <div id="complete">

        <div id="completeBox">

            <h1>
                🎉 Puzzle Complete!
            </h1>

            <p id="completeText">
            </p>

            <button id="completeNewPuzzle">
                New Puzzle
            </button>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById("canvas");

const guideOpacity =
    document.getElementById(
        "guideOpacity"
    );

const guideOpacityValue =
    document.getElementById(
        "guideOpacityValue"
    );

const snapSound =
    document.getElementById("snapSound");

const snapHighlight = document.getElementById("snapHighlight");

const ctx =
    canvas.getContext("2d");

const game =
    document.getElementById("game");

const photoInput =
    document.getElementById("photo");

const pieceCount =
    document.getElementById("pieceCount");

const newPuzzleButton =
    document.getElementById("newPuzzle");

const previewButton =
    document.getElementById("previewButton");

const preview =
    document.getElementById("preview");

const status =
    document.getElementById("status");

const complete =
    document.getElementById("complete");

const completeText =
    document.getElementById("completeText");

const completeNewPuzzle =
    document.getElementById("completeNewPuzzle");

const toolbar =
    document.getElementById("toolbar");

const mobileMenuButton =
    document.getElementById("mobileMenuButton");

const sampleMountain =
    document.getElementById("sampleMountain");

const sampleLighthouse =
    document.getElementById("sampleLighthouse");


/* =========================================================
   IMAGE
   ========================================================= */

const image =
    new Image();

let imageReady =
    false;


/* =========================================================
   PUZZLE SETTINGS
   ========================================================= */

let rows = 10;

let columns = 10;

let pieceWidth = 100;

let pieceHeight = 100;


/*
    Position of the completed photograph
    on the game canvas.
*/

let imageX = 0;

let imageY = 0;

let imageWidth = 0;

let imageHeight = 0;


/* =========================================================
   PIECES
   ========================================================= */

let pieces = [];

let groups = [];


/*
    A group is a collection of pieces that have
    already been joined together.
*/


/* =========================================================
   DRAGGING
   ========================================================= */

let dragging = null;


/* =========================================================
   SNAP SOUND
   ========================================================= */

let audioContext = null;

function initAudio() {
    if (!audioContext) {
        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;
        if (!AudioContext) return;
        audioContext = new AudioContext();
    }
    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function playSnapSound() {
    if (!snapSound.checked) return;
    initAudio();
    if (!audioContext) return;

    const now = audioContext.currentTime;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.setValueAtTime(880, now);
    oscillator.frequency.exponentialRampToValueAtTime(520, now + 0.055);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.065);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start(now);
    oscillator.stop(now + 0.07);
}


/* =========================================================
   POST-SNAP VISUAL FEEDBACK
   ========================================================= */

let snapHighlightGroup = null;
let snapHighlightVisible = false;
let snapHighlightShowTimer = null;
let snapHighlightHideTimer = null;

function showSnapHighlight(group) {
    if (!snapHighlight.checked) return;
    if (snapHighlightShowTimer) {
        clearTimeout(snapHighlightShowTimer);
    }

    if (snapHighlightHideTimer) {
        clearTimeout(snapHighlightHideTimer);
    }

    snapHighlightGroup = group;
    snapHighlightVisible = false;

    /* Wait briefly after the snap before showing the highlight. */
    snapHighlightShowTimer = setTimeout(function() {

        snapHighlightVisible = true;
        draw();

        /* Keep the highlight brief. */
        snapHighlightHideTimer = setTimeout(function() {

            snapHighlightVisible = false;
            snapHighlightGroup = null;
            draw();

        }, 500);

    }, 50);
}


/* =========================================================
   PUZZLE TIMER
   ========================================================= */

let startTime = 0;

let completed = false;


/* =========================================================
   RANDOM NUMBER
   ========================================================= */

function random() {

    return Math.random();
}


/* =========================================================
   SELECT GRID
   ========================================================= */

function selectGrid(numberOfPieces) {

    /*
        Work out the best rows/columns combination
        for the photograph's aspect ratio.
    */

    const aspect =
        image.naturalWidth /
        image.naturalHeight;


    let bestRows = 1;

    let bestColumns =
        numberOfPieces;

    let bestDifference =
        Infinity;


    for (
        let r = 1;
        r <= numberOfPieces;
        r++
    ) {

        if (
            numberOfPieces % r !== 0
        ) {
            continue;
        }


        const c =
            numberOfPieces / r;


        const gridAspect =
            c / r;


        const difference =
            Math.abs(
                gridAspect -
                aspect
            );


        if (
            difference <
            bestDifference
        ) {

            bestDifference =
                difference;

            bestRows =
                r;

            bestColumns =
                c;
        }
    }


    rows =
        bestRows;

    columns =
        bestColumns;
}


/* =========================================================
   CALCULATE IMAGE SIZE
   ========================================================= */

function calculateImageSize() {

    const availableWidth =
        game.clientWidth;

    const availableHeight =
        game.clientHeight;


    const aspect =
        image.naturalWidth /
        image.naturalHeight;


    /*
        The completed photograph occupies roughly
        65% of the available width.

        This leaves room around it for loose pieces.
    */

    imageWidth =
        availableWidth * 0.62;

    imageHeight =
        imageWidth / aspect;


    if (
        imageHeight >
        availableHeight * 0.72
    ) {

        imageHeight =
            availableHeight * 0.72;

        imageWidth =
            imageHeight * aspect;
    }


    imageX =
        (availableWidth -
         imageWidth) / 2;


    imageY =
        (availableHeight -
         imageHeight) / 2;


    pieceWidth =
        imageWidth /
        columns;


    pieceHeight =
        imageHeight /
        rows;
}


/* =========================================================
   CREATE EDGE DEFINITIONS
   ========================================================= */

/*
    Each internal edge is generated once.

    1  = tab
   -1  = socket
    0  = straight
*/

function createEdges() {

    const vertical = [];
    const horizontal = [];


    /*
        Create one random definition for a shared edge.

        Both pieces sharing this edge will use the
        same definition, so they will always match.
    */

    function randomEdge() {

        return {

            /*
                Which piece gets the protruding tab.

                +1 = tab
                -1 = socket
            */

            type:
                Math.random() < 0.5
                    ? 1
                    : -1,


            /*
                Width of the tab/socket.

                Normal range is roughly 18% - 29%
                of the piece width/height.
            */

            width:
                0.18 +
                Math.random() * 0.11,


            /*
                Depth of the tab/socket.
            */

            depth:
                0.17 +
                Math.random() * 0.10,


            /*
                Width of the neck.
            */

            neck:
                0.075 +
                Math.random() * 0.065,

	    /*
            Position of the centre of the tab.

            0 = exactly centred.

            We allow approximately +/-15%
            of half the edge length.

            Keeping this relatively small prevents
            tabs getting too close to corners.
            */

            position:
                -0.15 +
                Math.random() * 0.30

        };
    }


    /*
        Vertical edges.

        There is one shared edge between each pair
        of horizontally adjacent pieces.
    */

    for (
        let row = 0;
        row < rows;
        row++
    ) {

        vertical[row] = [];

        for (
            let col = 0;
            col < columns - 1;
            col++
        ) {

            vertical[row][col] =
                randomEdge();
        }
    }


    /*
        Horizontal edges.

        There is one shared edge between each pair
        of vertically adjacent pieces.
    */

    for (
        let row = 0;
        row < rows - 1;
        row++
    ) {

        horizontal[row] = [];

        for (
            let col = 0;
            col < columns;
            col++
        ) {

            horizontal[row][col] =
                randomEdge();
        }
    }


    return {
        vertical,
        horizontal
    };
}



/* =========================================================
   CREATE PIECES
   ========================================================= */

function createPieces() {

    pieces = [];

    groups = [];


    const edges =
        createEdges();


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < columns;
            col++
        ) {

            const piece = {

                id:
                    row * columns +
                    col,

                row:
                    row,

                col:
                    col,


                /*
                    Correct completed position.
                */

                homeX:
                    imageX +
                    col * pieceWidth,

                homeY:
                    imageY +
                    row * pieceHeight,


                /*
                    Current position.
                */

                x: 0,

                y: 0,

		rotation: 0,


                /*
                    Jigsaw edges.
                */


                top:
                    row === 0
                        ? 0
                        : {
                           ...edges.horizontal[row - 1][col],
                           type:
                               -edges.horizontal[row - 1][col].type
                        },

                bottom:
                    row === rows - 1
                        ? 0
                        : edges.horizontal[row][col],

                left:
                    col === 0
                        ? 0
                        : {
                           ...edges.vertical[row][col - 1],
                           type:
                               -edges.vertical[row][col - 1].type
                        },

                right:
                    col === columns - 1
                        ? 0
                        : edges.vertical[row][col],


                group: null
            };


            pieces.push(piece);
        }
    }


    /*
        Initially every piece is its own group.
    */

    for (
        const piece of pieces
    ) {

        const group = {

            pieces: [
                piece
            ],

            z:
                groups.length
        };


        piece.group =
            group;


        groups.push(
            group
        );
    }
}


/* =========================================================
   DRAW JIGSAW EDGE
   ========================================================= */
/* =========================================================
   DRAW JIGSAW EDGE

   The edge is drawn in the direction supplied by
   createPiecePath():

       TOP    : left  -> right
       RIGHT  : top   -> bottom
       BOTTOM : right -> left
       LEFT   : bottom -> top

   type:
       +1 = protruding tab
       -1 = socket
   ========================================================= */

function drawEdge(
    x1,
    y1,
    x2,
    y2,
    edge,
    side
) {

    /*
        Straight outside edge.
    */

    if (edge === 0) {

        ctx.lineTo(
            x2,
            y2
        );

        return;
    }


    /*
        The edge is now an object containing:

            edge.type
            edge.width
            edge.depth
            edge.neck
    */

    const type =
        edge.type;


    /*
        Direction along the edge.
    */

    const vx =
        x2 - x1;

    const vy =
        y2 - y1;

    const length =
        Math.sqrt(
            vx * vx +
            vy * vy
        );


    const tx =
        vx / length;

    const ty =
        vy / length;


    /*
        Outward normal for this side.
    */

    let nx = 0;
    let ny = 0;


    if (side === "top") {

        nx = 0;
        ny = -1;

    } else if (side === "right") {

        nx = 1;
        ny = 0;

    } else if (side === "bottom") {

        nx = 0;
        ny = 1;

    } else if (side === "left") {

        nx = -1;
        ny = 0;
    }


    /*
        Reverse direction for a socket.
    */

    nx *= type;
    ny *= type;


    /*
        Randomised jigsaw proportions.

        Because width/depth/neck came from the
        shared edge, the neighbouring piece gets
        exactly the complementary shape.
    */

    const tabWidth =
        length * edge.width;

    const neckWidth =
        length * edge.neck;

    const depth =
        length * edge.depth;


    /*
        Random point of the edge.
    */

    const centreOffset =
    length * edge.position;

    let cx;
    let cy;


    /*
        Horizontal edges:

        Use the physical X direction rather than
        the direction in which the path is travelling.

         This means the top and bottom of a join
        get exactly the same tab position.
    */

    if (side === "top" || side === "bottom") {

        cx =
            (x1 + x2) / 2 +
            centreOffset;

        cy =
            (y1 + y2) / 2;

    }


    /*
        Vertical edges:

        Use the physical Y direction rather than
        the direction in which the path is travelling.

        This means the left and right of a join
        get exactly the same tab position.
    */

    else {

        cx =
            (x1 + x2) / 2;

        cy =
            (y1 + y2) / 2 +
            centreOffset;
    }


    /*
        Start and end of the curved section.
    */

    const aX =
        cx - tx * tabWidth;

    const aY =
        cy - ty * tabWidth;


    const bX =
        cx - tx * neckWidth;

    const bY =
        cy - ty * neckWidth;


    const cX =
        cx + tx * neckWidth;

    const cY =
        cy + ty * neckWidth;


    const dX =
        cx + tx * tabWidth;

    const dY =
        cy + ty * tabWidth;


    /*
        Straight edge up to the curve.
    */

    ctx.lineTo(
        aX,
        aY
    );


    /*
        First side of neck.
    */

    ctx.bezierCurveTo(

        cx - tx * tabWidth * 0.65,
        cy - ty * tabWidth * 0.65,

        bX,
        bY,

        bX + nx * depth * 0.30,
        bY + ny * depth * 0.30
    );


    /*
        First half of bulb/socket.
    */

    ctx.bezierCurveTo(

        bX + nx * depth * 0.75,
        bY + ny * depth * 0.75,

        cx - tx * tabWidth * 0.55
            + nx * depth,

        cy - ty * tabWidth * 0.55
            + ny * depth,

        cx + nx * depth,
        cy + ny * depth
    );


    /*
        Second half of bulb/socket.
    */

    ctx.bezierCurveTo(

        cx + tx * tabWidth * 0.55
            + nx * depth,

        cy + ty * tabWidth * 0.55
            + ny * depth,

        cX + nx * depth * 0.75,
        cY + ny * depth * 0.75,

        cX + nx * depth * 0.30,
        cY + ny * depth * 0.30
    );


    /*
        Return to the normal edge.
    */

    ctx.bezierCurveTo(

        cX,
        cY,

        cx + tx * tabWidth * 0.65,
        cy + ty * tabWidth * 0.65,

        dX,
        dY
    );


    /*
        Finish the edge.
    */

    ctx.lineTo(
        x2,
        y2
    );
}






/* =========================================================
   CREATE PIECE PATH
   ========================================================= */

function createPiecePath(
    piece
) {

    const w =
        pieceWidth;

    const h =
        pieceHeight;


    ctx.beginPath();

    ctx.moveTo(
        0,
        0
    );


    /*
        TOP
    */

    if (
        piece.top === 0
    ) {

        ctx.lineTo(
            w,
            0
        );

    } else {

        drawEdge(
            0,
            0,
            w,
            0,
	    piece.top,
            "top"
        );
    }


    /*
        RIGHT
    */

    if (
        piece.right === 0
    ) {

        ctx.lineTo(
            w,
            h
        );

    } else {

        drawEdge(
            w,
            0,
            w,
            h,
            piece.right,
	    "right"
        );
    }


    /*
        BOTTOM
    */

    if (
        piece.bottom === 0
    ) {

        ctx.lineTo(
            0,
            h
        );

    } else {

        drawEdge(
            w,
            h,
            0,
            h,
            piece.bottom,
	    "bottom"
        );
    }


    /*
        LEFT
    */

    if (
        piece.left === 0
    ) {

        ctx.lineTo(
            0,
            0
        );

    } else {

        drawEdge(
            0,
            h,
            0,
            0,
            piece.left,
	    "left"
        );
    }


    ctx.closePath();
}


/* =========================================================
   SCATTER PIECES
   ========================================================= */
function scatterPieces() {

    /*
        Area available for loose pieces.

        We create a grid of possible positions and
        shuffle it rather than randomly throwing pieces
        around. This prevents pieces piling on top of
        each other.
    */

    const padding =
        Math.max(
            20,
            Math.min(pieceWidth, pieceHeight) * 0.25
        );


    const spacingX =
        pieceWidth + padding;

    const spacingY =
        pieceHeight + padding;


    /*
        Build possible positions.
    */

    const positions = [];


    for (
        let y = padding;
        y < game.clientHeight - pieceHeight;
        y += spacingY
    ) {

        for (
            let x = padding;
            x < game.clientWidth - pieceWidth;
            x += spacingX
        ) {

            /*
                Centre of this possible piece position.
            */

            const centreX =
                x + pieceWidth / 2;

            const centreY =
                y + pieceHeight / 2;


            /*
                Don't place loose pieces directly
                over the completed photograph.
            */

            const overlapsImage =

                centreX >
                    imageX - pieceWidth * 0.25 &&

                centreX <
                    imageX +
                    imageWidth +
                    pieceWidth * 0.25 &&

                centreY >
                    imageY - pieceHeight * 0.25 &&

                centreY <
                    imageY +
                    imageHeight +
                    pieceHeight * 0.25;


            if (!overlapsImage) {

                positions.push({
                    x,
                    y
                });
            }
        }
    }


    /*
        Shuffle the available positions.
    */

    for (
        let i = positions.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            positions[i],
            positions[j]
        ] =
        [
            positions[j],
            positions[i]
        ];
    }


    /*
        If there aren't enough positions around
        the photograph, create additional positions
        inside the available game area.

        This is mainly useful for 100/200 piece puzzles.
    */

    let extraAttempt = 0;

    while (
        positions.length < pieces.length &&
        extraAttempt < 5000
    ) {

        extraAttempt++;


        const x =
            Math.random() *
            Math.max(
                1,
                game.clientWidth - pieceWidth
            );


        const y =
            Math.random() *
            Math.max(
                1,
                game.clientHeight - pieceHeight
            );


        const centreX =
            x + pieceWidth / 2;

        const centreY =
            y + pieceHeight / 2;


        /*
            Check whether this position is reasonably
            clear of existing positions.
        */

        let suitable = true;


        for (
            const existing of positions
        ) {

            const dx =
                centreX -
                (
                    existing.x +
                    pieceWidth / 2
                );

            const dy =
                centreY -
                (
                    existing.y +
                    pieceHeight / 2
                );


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if (
                distance <
                Math.min(
                    pieceWidth,
                    pieceHeight
                ) * 0.85
            ) {

                suitable = false;
                break;
            }
        }


        if (suitable) {

            positions.push({
                x,
                y
            });
        }
    }


    /*
        Shuffle the pieces themselves.
    */

    const shuffledPieces =
        [...pieces];


    for (
        let i = shuffledPieces.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            shuffledPieces[i],
            shuffledPieces[j]
        ] =
        [
            shuffledPieces[j],
            shuffledPieces[i]
        ];
    }


    /*
        Assign positions.
    */

    for (
        let i = 0;
        i < shuffledPieces.length;
        i++
    ) {

        const piece =
            shuffledPieces[i];

        const position =
            positions[
                i % positions.length
            ];


        piece.x =
            position.x;

        piece.y =
            position.y;

        piece.rotation =
            (
                Math.random() * 24
            ) - 12;
    }
}



/* =========================================================
   RECTANGLE OVERLAP
   ========================================================= */

function rectanglesOverlap(
    x1,
    y1,
    w1,
    h1,
    x2,
    y2,
    w2,
    h2
) {

    return !(
        x1 + w1 <= x2 ||
        x1 >= x2 + w2 ||
        y1 + h1 <= y2 ||
        y1 >= y2 + h2
    );
}


/* =========================================================
   DRAW TARGET
   ========================================================= */

function drawTarget() {

    /*
        Convert the slider value to an opacity
        between 0 and 1.
    */

    const opacity =
        Number(
            guideOpacity.value
        ) / 100;


    /*
        Draw the photograph as a faint guide.
    */

    if (
        opacity > 0 &&
        image.complete
    ) {

        ctx.save();

        ctx.globalAlpha =
            opacity;

        ctx.drawImage(
            image,
            imageX,
            imageY,
            imageWidth,
            imageHeight
        );

        ctx.restore();
    }


    /*
        Draw a border around the puzzle area.

        The border remains visible even when the
        guide opacity is set to zero.
    */

    ctx.save();

    ctx.strokeStyle =
        "rgba(180,180,180,0.65)";

    ctx.lineWidth =
        1;

    ctx.strokeRect(
        imageX,
        imageY,
        imageWidth,
        imageHeight
    );

    ctx.restore();
}


/* =========================================================
   DRAW ALL PIECES
   ========================================================= */

function drawPieces() {

    /*
        Draw lower pieces first and higher pieces last.
    */

    const ordered =
        [...pieces].sort(
            function(a, b) {
                return a.group.z - b.group.z;
            }
        );


    for (const piece of ordered) {

        ctx.save();


        /*
            Move the drawing origin to the top-left
            of this particular piece.
        */

        ctx.translate(
            piece.x,
            piece.y
        );

	ctx.rotate(
            piece.rotation *
            Math.PI / 180
        );


        /*
            -------------------------------------------------
            PIECE SHADOW
            -------------------------------------------------

            Draw the piece shape once with a soft shadow
            before clipping the photograph into it.
            This gives the pieces a subtle raised/cardboard
            appearance without changing the piece geometry.

            A slightly stronger shadow is used while the
            piece/group is being dragged.
        */

        createPiecePath(piece);

        const pieceIsBeingDragged =
            dragging &&
            dragging.group === piece.group;

        ctx.shadowColor =
            pieceIsBeingDragged
                ? "rgba(0,0,0,0.70)"
                : "rgba(0,0,0,0.35)";

        ctx.shadowBlur =
            pieceIsBeingDragged ? 42 : 6;

        ctx.shadowOffsetX =
            pieceIsBeingDragged ? 5 : 2;

        ctx.shadowOffsetY =
            pieceIsBeingDragged ? 7 : 3;

        ctx.fillStyle =
            "rgba(0,0,0,1)";

        ctx.fill();

        /*
            Now create the clipping path again.
            The shadow above is already rendered and the
            photograph will cover the black fill.
        */

        createPiecePath(piece);
        ctx.clip();

        /*
            Turn shadows off for the photograph itself.
        */

        ctx.shadowColor =
            "transparent";

        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;


        /*
            -------------------------------------------------
            DRAW THE CORRECT PART OF THE PHOTOGRAPH
            -------------------------------------------------

            This is the important change.

            Rather than drawing the whole photograph and
            hoping the coordinate systems line up, we take
            the exact rectangular section belonging to this
            piece and draw it into the piece.

            The small overlap around the edges allows the
            curved jigsaw tabs to contain image information.
        */

        const overlap =
            Math.max(
                pieceWidth,
                pieceHeight
            ) * 0.30;


        const sourceX =
            piece.col *
            (image.naturalWidth / columns)
            - overlap *
            image.naturalWidth /
            imageWidth;


        const sourceY =
            piece.row *
            (image.naturalHeight / rows)
            - overlap *
            image.naturalHeight /
            imageHeight;


        const sourceWidth =
            image.naturalWidth /
            columns
            +
            overlap * 2 *
            image.naturalWidth /
            imageWidth;


        const sourceHeight =
            image.naturalHeight /
            rows
            +
            overlap * 2 *
            image.naturalHeight /
            imageHeight;


        const destinationX =
            -overlap;


        const destinationY =
            -overlap;


        const destinationWidth =
            pieceWidth +
            overlap * 2;


        const destinationHeight =
            pieceHeight +
            overlap * 2;


        /*
            Keep the source rectangle inside the photograph.
        */

        const sx =
            Math.max(
                0,
                sourceX
            );

        const sy =
            Math.max(
                0,
                sourceY
            );

        const sx2 =
            Math.min(
                image.naturalWidth,
                sourceX +
                sourceWidth
            );

        const sy2 =
            Math.min(
                image.naturalHeight,
                sourceY +
                sourceHeight
            );


        const actualSourceWidth =
            sx2 - sx;

        const actualSourceHeight =
            sy2 - sy;


        /*
            Work out where the cropped image should be
            placed if the source rectangle was clipped
            at the photograph boundary.
        */

        const adjustedX =
            destinationX +
            (sx - sourceX) *
            (
                destinationWidth /
                sourceWidth
            );


        const adjustedY =
            destinationY +
            (sy - sourceY) *
            (
                destinationHeight /
                sourceHeight
            );


        const adjustedWidth =
            actualSourceWidth *
            (
                destinationWidth /
                sourceWidth
            );


        const adjustedHeight =
            actualSourceHeight *
            (
                destinationHeight /
                sourceHeight
            );

	if (pieceIsBeingDragged) {
            ctx.filter = "brightness(1.25)";
        }

        ctx.drawImage(

            image,

            sx,
            sy,

            actualSourceWidth,
            actualSourceHeight,

            adjustedX,
            adjustedY,

            adjustedWidth,
            adjustedHeight
        );
	
	ctx.filter = "none";

        ctx.restore();

        /*
            Draw the black outline around the piece.
        */

        ctx.save();

        ctx.translate(
            piece.x,
            piece.y
        );

	ctx.rotate(
            piece.rotation *
            Math.PI / 180
        );


        createPiecePath(piece);


        ctx.strokeStyle =
            "rgba(0,0,0,0.85)";

        ctx.lineWidth =
            Math.max(
                1,
                Math.min(
                    pieceWidth,
                    pieceHeight
                ) * 0.018
            );


        ctx.stroke();


        /*
            Small white highlight gives the pieces
            a slightly raised appearance.
        */

        ctx.strokeStyle =
            "rgba(255,255,255,0.25)";

        ctx.lineWidth = 0.6;

        ctx.stroke();


        /*
            -------------------------------------------------
            POST-SNAP FEEDBACK
            -------------------------------------------------

            The highlight is shown only after a successful
            snap, never while a piece is merely near its
            destination.
        */

        if (
            snapHighlightVisible &&
            snapHighlightGroup &&
            piece.group === snapHighlightGroup
        ) {

            createPiecePath(piece);

            ctx.save();

            ctx.shadowColor =
                "rgba(255,210,70,0.70)";

            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;

            ctx.strokeStyle =
                "rgba(255,220,90,0.90)";

            ctx.lineWidth =
                Math.max(
                    2,
                    Math.min(
                        pieceWidth,
                        pieceHeight
                    ) * 0.025
                );

            ctx.stroke();

            ctx.restore();
        }


        ctx.restore();
    }
}

/* =========================================================
   DRAW EVERYTHING
   ========================================================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (!imageReady) {
        return;
    }


    drawTarget();

    drawPieces();


    status.textContent =
        groups.length +
        " groups • " +
        pieces.length +
        " pieces";
}


/* =========================================================
   BRING GROUP TO FRONT
   ========================================================= */

function bringToFront(
    group
) {

    let highest =
        0;


    for (
        const g of groups
    ) {

        highest =
            Math.max(
                highest,
                g.z
            );
    }


    group.z =
        highest + 1;
}


/* =========================================================
   POINTER POSITION
   ========================================================= */

function pointerPosition(
    event
) {

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top
    };
}


/* =========================================================
   FIND PIECE UNDER MOUSE
   ========================================================= */
function findPiece(position) {

    /*
        Test pieces from front to back.
    */

    const ordered =
        [...pieces].sort(
            (a, b) =>
                b.group.z -
                a.group.z
        );


    for (
        const piece of ordered
    ) {

        /*
            Convert the mouse position into the
            coordinate system of the rotated piece.
        */

        const dx =
            position.x -
            (
                piece.x +
                pieceWidth / 2
            );

        const dy =
            position.y -
            (
                piece.y +
                pieceHeight / 2
            );


        const angle =
            -piece.rotation *
            Math.PI / 180;


        const localX =
            dx * Math.cos(angle) -
            dy * Math.sin(angle);


        const localY =
            dx * Math.sin(angle) +
            dy * Math.cos(angle);


        /*
            Convert back from centre coordinates
            to the piece's local top-left coordinates.
        */

        const x =
            localX +
            pieceWidth / 2;

        const y =
            localY +
            pieceHeight / 2;


        /*
            Slightly generous hit area makes the
            rotated pieces easy to select.
        */

        const marginX =
            pieceWidth * 0.25;

        const marginY =
            pieceHeight * 0.25;


        if (
            x >= -marginX &&
            x <= pieceWidth + marginX &&
            y >= -marginY &&
            y <= pieceHeight + marginY
        ) {

            return piece;
        }
    }


    return null;
}



/* =========================================================
   MOVE GROUP
   ========================================================= */

function moveGroup(
    group,
    dx,
    dy
) {

    for (
        const piece of group.pieces
    ) {

        piece.x += dx;

        piece.y += dy;
    }
}



/* =========================================================
   TRY TO SNAP
   ========================================================= */

function trySnap(piece) {

    const group =
        piece.group;


    /*
        How close pieces have to be before snapping.
    */

    const tolerance =
        Math.min(
            pieceWidth,
            pieceHeight
        ) * 0.35;


    /*
        The four possible neighbours.
    */

    const neighbours = [];


    /*
        LEFT
    */

    if (piece.col > 0) {

        neighbours.push(
            pieces[
                piece.row *
                columns +
                (piece.col - 1)
            ]
        );
    }


    /*
        RIGHT
    */

    if (
        piece.col <
        columns - 1
    ) {

        neighbours.push(
            pieces[
                piece.row *
                columns +
                (piece.col + 1)
            ]
        );
    }


    /*
        ABOVE
    */

    if (piece.row > 0) {

        neighbours.push(
            pieces[
                (piece.row - 1) *
                columns +
                piece.col
            ]
        );
    }


    /*
        BELOW
    */

    if (
        piece.row <
        rows - 1
    ) {

        neighbours.push(
            pieces[
                (piece.row + 1) *
                columns +
                piece.col
            ]
        );
    }


    /*
        Examine each correct neighbour.
    */

    for (
        const neighbour of neighbours
    ) {

        /*
            Already joined?
        */

        if (
            neighbour.group ===
            group
        ) {

            continue;
        }


        /*
            -----------------------------------------
            CHECK DISTANCE
            -----------------------------------------
        */

        const expectedX =
            neighbour.x +
            (
                piece.homeX -
                neighbour.homeX
            );


        const expectedY =
            neighbour.y +
            (
                piece.homeY -
                neighbour.homeY
            );


        const dx =
            piece.x -
            expectedX;


        const dy =
            piece.y -
            expectedY;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
            Not close enough.
        */

        if (
            distance >
            tolerance
        ) {

            continue;
        }


        /*
            -----------------------------------------
            SNAP EVERYTHING TO ZERO ROTATION
            -----------------------------------------

            This is the important part.

            Loose pieces may be randomly rotated,
            but an assembled puzzle is always straight.
        */

        for (
            const p of
            group.pieces
        ) {

            p.rotation = 0;
        }


        for (
            const p of
            neighbour.group.pieces
        ) {

            p.rotation = 0;
        }


        /*
            -----------------------------------------
            RECALCULATE POSITION
            -----------------------------------------

            Resetting the rotation can slightly change
            the visual position of the piece, so calculate
            the snap position again.
        */

        const newExpectedX =
            neighbour.x +
            (
                piece.homeX -
                neighbour.homeX
            );


        const newExpectedY =
            neighbour.y +
            (
                piece.homeY -
                neighbour.homeY
            );


        const newDX =
            piece.x -
            newExpectedX;


        const newDY =
            piece.y -
            newExpectedY;


        /*
            Move the entire selected group into
            the exact correct position.
        */

        moveGroup(
            group,
            -newDX,
            -newDY
        );


        /*
            -----------------------------------------
            MERGE GROUPS
            -----------------------------------------
        */

        const targetGroup =
            neighbour.group;


        for (
            const p of
            group.pieces
        ) {

            p.group =
                targetGroup;

            targetGroup.pieces.push(
                p
            );
        }


        /*
            Remove old group.
        */

        groups =
            groups.filter(
                function(g) {

                    return (
                        g !==
                        group
                    );
                }
            );


        /*
            Bring joined group to the front.
        */

        bringToFront(
            targetGroup
        );


        return true;
    }


    return false;
}



/* =========================================================
   CHECK COMPLETE
   ========================================================= */

function checkComplete() {

    if (
        groups.length !== 1
    ) {
        return;
    }


    const piece =
        pieces[0];


    const dx =
        piece.x -
        piece.homeX;


    const dy =
        piece.y -
        piece.homeY;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
        The complete group must be sitting in
        approximately the correct location.
    */

    if (
        distance >
        Math.min(
            pieceWidth,
            pieceHeight
        ) * .5
    ) {

        return;
    }


    /*
        Snap everything perfectly into place.
    */

    for (
        const p of pieces
    ) {

        p.x =
            p.homeX;

        p.y =
            p.homeY;
    }


    completed =
        true;


    draw();


    /*
        Calculate time.
    */

    const elapsed =
        Math.floor(
            (
                Date.now() -
                startTime
            ) / 1000
        );


    const minutes =
        Math.floor(
            elapsed / 60
        );


    const seconds =
        elapsed % 60;


    completeText.textContent =
        "You completed the " +
        pieces.length +
        "-piece puzzle in " +
        minutes +
        "m " +
        seconds +
        "s.";


    complete.style.display =
        "flex";
}

/* =========================================================
   OPACITY CONTROL
   ========================================================= */
guideOpacity.addEventListener(
    "input",
    function() {

        guideOpacityValue.textContent =
            guideOpacity.value + "%";

        draw();
    }
);

/* =========================================================
   MOUSE / TOUCH DOWN
   ========================================================= */

canvas.addEventListener(
    "pointerdown",
    function(event) {

        initAudio();

        if (
            !imageReady ||
            completed
        ) {
            return;
        }


        const position =
            pointerPosition(
                event
            );


        const piece =
            findPiece(
                position
            );


        if (!piece) {
            return;
        }


        /*
            Bring the whole group to the front.
        */

        bringToFront(
            piece.group
        );


        /*
            Remember exactly which group was picked up.
        */

        dragging = {

            group:
                piece.group,

            lastX:
                position.x,

            lastY:
                position.y
        };


        canvas.setPointerCapture(
            event.pointerId
        );


        event.preventDefault();
    }
);


/* =========================================================
   MOUSE / TOUCH MOVE
   ========================================================= */

canvas.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const position =
            pointerPosition(
                event
            );


        const dx =
            position.x -
            dragging.lastX;


        const dy =
            position.y -
            dragging.lastY;


        /*
            Move EVERY piece in the selected group.
        */

        moveGroup(
            dragging.group,
            dx,
            dy
        );


        dragging.lastX =
            position.x;


        dragging.lastY =
            position.y;


        draw();


        event.preventDefault();
    }
);


/* =========================================================
   MOUSE / TOUCH UP
   ========================================================= */

canvas.addEventListener(
    "pointerup",
    function(event) {

        if (!dragging) {
            return;
        }


        /*
            ------------------------------------------------
            CORNER SNAP
            ------------------------------------------------

            Corner snapping is deliberately handled here,
            separately from trySnap().

            This prevents the corner operation from
            interfering with the normal piece-to-piece
            snapping loop below.
        */

        const currentGroup =
            dragging.group;

        const currentPieces =
            [...currentGroup.pieces];

        /* Group that successfully snapped during this release. */
        let snappedGroup = null;

        for (
            const piece of currentPieces
        ) {

            const isTop =
                piece.row === 0;

            const isBottom =
                piece.row === rows - 1;

            const isLeft =
                piece.col === 0;

            const isRight =
                piece.col === columns - 1;

            const isCorner =
                (isTop && isLeft) ||
                (isTop && isRight) ||
                (isBottom && isLeft) ||
                (isBottom && isRight);

            if (!isCorner) {
                continue;
            }

            /*
                Work out how close the corner piece
                is to its correct frame position.
            */

            const dx =
                piece.x -
                piece.homeX;

            const dy =
                piece.y -
                piece.homeY;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            const cornerTolerance =
                Math.min(
                    pieceWidth,
                    pieceHeight
                ) * 0.50;

            if (
                distance <=
                cornerTolerance
            ) {

                /*
                    Straighten the complete group.
                */

                for (
                    const p of currentGroup.pieces
                ) {
                    p.rotation = 0;
                }

                /*
                    Put the corner exactly on
                    its correct frame position.
                */

                moveGroup(
                    currentGroup,
                    piece.homeX - piece.x,
                    piece.homeY - piece.y
                );

                bringToFront(
                    currentGroup
                );

                snappedGroup = currentGroup;

                break;
            }
        }


        /*
            Keep trying to snap pieces.

            This is useful when a group is moved into
            a position where two or more pieces can
            connect at once.
        */

        let joined = true;


        while (joined) {

            joined = false;


            /*
                Make a copy because the group may change
                during the operation.
            */

            const currentPieces =
                [
                    ...dragging.group.pieces
                ];


            for (
                const piece of
                currentPieces
            ) {

                if (
                    trySnap(
                        piece
                    )
                ) {

                    joined = true;

                    /*
                        The group may have been merged into
                        another group, so obtain the new group.
                    */

                    dragging.group =
                        piece.group;

                    snappedGroup =
                        dragging.group;


                    break;
                }
            }
        }


        if (snappedGroup) {
            playSnapSound();
            showSnapHighlight(snappedGroup);
        }


        /*
            The drag styling is based on the dragging variable.
            Clear it BEFORE redrawing so a newly snapped group
            immediately returns to its normal appearance.
        */

        dragging =
            null;


        draw();


        checkComplete();


        event.preventDefault();
    }
);



/* =========================================================
   POINTER CANCEL
   ========================================================= */

canvas.addEventListener(
    "pointercancel",
    function() {

        dragging =
            null;
    }
);


/* =========================================================
   MOBILE MENU
   ========================================================= */

function closeMobileMenu() {
    toolbar.classList.remove("menu-open");
    mobileMenuButton.setAttribute("aria-expanded", "false");
    mobileMenuButton.textContent = "☰";
    mobileMenuButton.setAttribute("aria-label", "Open menu");
}

mobileMenuButton.addEventListener("click", function(event) {
    event.stopPropagation();

    const open =
        toolbar.classList.toggle("menu-open");

    mobileMenuButton.setAttribute(
        "aria-expanded",
        open ? "true" : "false"
    );

    mobileMenuButton.textContent =
        open ? "×" : "☰";

    mobileMenuButton.setAttribute(
        "aria-label",
        open ? "Close menu" : "Open menu"
    );
});

document.addEventListener("pointerdown", function(event) {
    if (
        toolbar.classList.contains("menu-open") &&
        !toolbar.contains(event.target)
    ) {
        closeMobileMenu();
    }
});

function loadSampleImage(url, name) {
    status.textContent = "Loading " + name + "…";

    image.onload = function() {
        imageReady = true;
        preview.src = url;
        status.textContent = name;
        newPuzzle();
        closeMobileMenu();
    };

    image.onerror = function() {
        status.textContent = "Unable to load " + name;
        alert("The sample photograph could not be loaded. Please check your internet connection.");
    };

    image.src = url;
}

sampleMountain.addEventListener("click", function() {
    closeMobileMenu();
    loadSampleImage(
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Mountain_lake_in_Alps.jpg",
        "Mountain Lake"
    );
});

sampleLighthouse.addEventListener("click", function() {
    closeMobileMenu();
    loadSampleImage(
        "https://commons.wikimedia.org/wiki/Special:Redirect/file/Tynemouth_Lighthouse,_2006.jpg",
        "Lighthouse"
    );
});

/* =========================================================
   START NEW PUZZLE
   ========================================================= */

function updateToolbarHeight() {
    const toolbar = document.getElementById("toolbar");
    document.documentElement.style.setProperty(
        "--toolbar-height",
        toolbar.offsetHeight + "px"
    );
}

window.addEventListener("load", updateToolbarHeight);
window.addEventListener("resize", updateToolbarHeight);


function newPuzzle() {

    if (!imageReady) {

        alert(
            "Please choose a photograph first."
        );

        return;
    }


    complete.style.display =
        "none";


    completed =
        false;


    /*
        Set canvas size.
    */

    canvas.width =
        game.clientWidth;

    canvas.height =
        game.clientHeight;


    /*
        Select requested puzzle size.
    */

    const number =
        Number(
            pieceCount.value
        );


    selectGrid(
        number
    );


    calculateImageSize();


    createPieces();


    scatterPieces();


    startTime =
        Date.now();


    draw();
}


/* =========================================================
   LOAD IMAGE
   ========================================================= */

photoInput.addEventListener(
    "change",
    function(event) {

        closeMobileMenu();

        const file =
            event.target.files[0];


        if (!file) {
            return;
        }


        /*
            Browser creates a temporary local URL.

            The photograph is NOT uploaded to a server.
        */

        const url =
            URL.createObjectURL(
                file
            );


        image.onload =
            function() {

                imageReady =
                    true;


                preview.src =
                    url;


                newPuzzle();
            };


        image.src =
            url;
    }
);


/* =========================================================
   BUTTONS
   ========================================================= */

newPuzzleButton.addEventListener(
    "click",
    function() {
        closeMobileMenu();
        newPuzzle();
    }
);


completeNewPuzzle.addEventListener(
    "click",
    function() {
        closeMobileMenu();
        newPuzzle();
    }
);


pieceCount.addEventListener(
    "change",
    function() {

        if (imageReady) {
            newPuzzle();
        }
    }
);


/* =========================================================
   PREVIEW
   ========================================================= */

previewButton.addEventListener(
    "click",
    function() {

        closeMobileMenu();

        if (
            preview.style.display ===
            "none" ||
            preview.style.display === ""
        ) {

            preview.style.display =
                "block";

        } else {

            preview.style.display =
                "none";
        }
    }
);


/* =========================================================
   WINDOW RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    function() {

        if (imageReady) {
            newPuzzle();
        }
    }
);


/* =========================================================
   INITIALISE
   ========================================================= */

canvas.width =
    game.clientWidth;

canvas.height =
    game.clientHeight;

</script>

</body>
</html>
